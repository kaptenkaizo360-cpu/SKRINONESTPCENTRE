const SUBJ={

  KM:{n:"Kemahiran Manipulatif",h:22},
  PD:{n:"Pengurusan Diri",h:42},
  MZ:{n:"Pendidikan Muzik",h:58},
  PSV:{n:"Pendidikan Seni Visual",h:88},

function colorFor(l,mode){ // returns [bgHue, chipHue]

function cellHTML(l,mode,perspective){

  if(perspective==="guru"){h=KELAS_HUE[l.kelas];h2=SUBJ[l.sub].h}

    :(l.virtual?`<span class="meta">${l.sub==="YASIN"?"Semua murid":"Semua guru"}</span>`:`<span class="tag" style="--h2:${SUBJ[l.sub].h}"><span class="dot"></span>${l.sub}</span>`);
  return {neutral,h,h2,big,chip};
}
function buildGrid(rows,perspective){
  // rows: {day: [lessons]}
  let html=`<table class="tt"><thead><tr><th class="day" style="background:none"></th>`;
  for(let i=1;i<=10;i++){if(i===5)html+=`<th class="rehat-h"></th>`;html+=`<th>${i}<small>${slotStart(i-1)}–${slotEnd(i-1)}</small></th>`}
  html+=`</tr></thead><tbody>`;
  DAYS.forEach(([d,dn],di)=>{
    html+=`<tr class="${d===todayCode?"is-today":""}"><th class="day" title="${dn}">${d}</th>`;
    const ls=rows[d]||[];let i=1;
    while(i<=10){
      if(i===5){html+=di===0?`<td class="rehat" rowspan="5">REHAT</td>`:"";}
      const l=ls.find(x=>x.s===i);
      if(l){
        let len=l.len; if(l.s<=4&&l.s+len-1>=5)len=5-l.s; // safety: never cross rehat
        const c=cellHTML(l,null,perspective);
        html+=`<td colspan="${len}"><button class="cell${c.neutral?" neutral":""}" style="--h:${c.h}" data-les="${l._i}" aria-label="${esc(SUBJ[l.sub].n)}, ${l.kelas}, ${dn} ${range(l.s,l.len)}">
          <span class="big">${c.big}</span>${c.chip}</button></td>`;
        i+=len;
      }else{html+=`<td class="empty"></td>`;i++}
    }
    html+=`</tr>`;
  });
  return html+`</tbody></table>`;
}
function buildDayList(rows,perspective){
  return DAYS.map(([d,dn])=>{
    const ls=(rows[d]||[]).slice().sort((a,b)=>a.s-b.s);
    let items="",rehatDone=false;
    for(const l of ls){
      if(!rehatDone&&l.s>=5&&ls.some(x=>x.s<5)){items+=`<div class="dl-rehat">REHAT 9:20 – 9:40</div>`;rehatDone=true}
      const c=cellHTML(l,null,perspective);
      items+=`<button class="cell${c.neutral?" neutral":""}" style="--h:${c.h}" data-les="${l._i}">
        <span class="time num">${range(l.s,l.len)}</span>

  g+=`</tbody></table>`;
  // legend
  const allRows=Object.values(rows).flat();
  const subs=Object.keys(SUBJ).filter(s=>lessons.some(l=>l.sub===s)||allRows.some(l=>l.sub===s));
  const half=Math.ceil(subs.length/2);
  const col=a=>`<div class="pg-leg-col">${a.map(s=>`<div><b>${s}</b><span>${esc(SUBJ[s].n.toUpperCase())}</span></div>`).join("")}</div>`;
  const teachers=perspective==="kelas"?[...new Set(lessons.filter(l=>l.t).map(l=>l.t))]:[];
  return `<div class="pg-frame"><div class="pg" style="width:${PAGE_W}px">
    <div class="pg-head">
      <div class="pg-school">SEKOLAH KEBANGSAAN SERI INTAN, KLUANG</div>
      <div class="pg-prog">PROGRAM PENDIDIKAN KHAS INTEGRASI</div>
      <div class="pg-banner">${esc(title)}</div>
    </div>
    <div class="pg-tag">SK SERI INTAN KLUANG (PPKI)</div>
    ${g}
    <div class="pg-meta"><span>Jadual waktu terjana: 20/9/2026</span><span>1 waktu = 30 minit</span></div>
    <div class="pg-note"><b>NOTA:</b> ${YASIN_NOTE}</div>
    <div class="pg-bottom">
      <div class="pg-leg">
        <div class="pg-leg-title">MATA PELAJARAN</div>
        <div class="pg-leg-cols">${col(subs.slice(0,half))}${col(subs.slice(half))}</div>
        ${perspective==="guru"?`<div class="pg-leg-title" style="margin-top:10px">KELAS</div><div class="pg-leg-t">${[...new Set(lessons.map(l=>l.kelas))].filter(k=>KELAS[k]).map(k=>`<span><span class="swatch" style="--h:${KELAS_HUE[k]}"></span><b>${k}</b> ${esc(KELAS_INFO[k].toUpperCase())}</span>`).join("")}</div>`:""}
        ${teachers.length?`<div class="pg-leg-title" style="margin-top:10px">GURU</div><div class="pg-leg-t">${teachers.map(t=>`<span><span class="dot" style="--h:${TEACH[t].h}"></span><b>${TEACH[t].nick.toUpperCase()}</b> ${esc(fullName(t).toUpperCase())}</span>`).join("")}</div>`:""}
      </div>
      <div class="pg-sign">
        <div>DISAHKAN OLEH</div>
        <div class="pg-sign-line"></div>
        <div class="pg-sign-sub">Tandatangan &amp; Cop</div>
      </div>
    </div>
  </div></div>`;
}
function fitPages(){
  document.querySelectorAll(".pg-frame").forEach(f=>{
    const p=f.firstElementChild;const sc=Math.min(1,f.clientWidth/PAGE_W);
    p.style.transform=`scale(${sc})`;f.style.height=(p.offsetHeight*sc)+"px";
  });
}
window.addEventListener("resize",fitPages);
try{document.fonts.ready.then(fitPages)}catch(e){}

function colorToggle(){
  return `<div class="seg">Warna ikut
    <div class="tabs" role="group" aria-label="Warna ikut">
      <button data-color="subjek" aria-selected="${state.colorBy==="subjek"}">Subjek</button>
      <button data-color="guru" aria-selected="${state.colorBy==="guru"}">Guru</button>
    </div></div>`;
}

function renderKelas(){
  const k=state.kelas;
  const rows={};DAYS.forEach(([d])=>rows[d]=classDay(k,d));
  const all=LES.filter(l=>l.kelas===k);
  const w=all.reduce((a,l)=>a+l.len,0), pdp=all.filter(l=>l.t).reduce((a,l)=>a+l.len,0);
  const guru=new Set(all.filter(l=>l.t).map(l=>l.t)).size, subj=new Set(all.filter(l=>l.t).map(l=>l.sub)).size;
  document.getElementById("v-kelas").innerHTML=`
    <div class="toolbar">
      <div class="picker" role="group" aria-label="Pilih kelas">${CLASSES.map(c=>`<button class="pill" data-kelas="${c}" aria-pressed="${c===k}" style="--h:250">${c}</button>`).join("")}</div>
      ${colorToggle()}
    </div>
    <div class="panel">
      <div class="head-card">
        <div><div class="eyebrow">Jadual waktu kelas</div><h2>${KELAS_INFO[k]}</h2></div>
        <div class="stats">
          <div><b class="num">${w}</b><span>waktu seminggu</span></div>
          <div><b>${jamSetahun(w)}</b><span>setahun (${MINGGU} minggu)</span></div>
          <div><b class="num">${pdp}</b><span>waktu PdP</span></div>
          <div><b class="num">${subj}</b><span>subjek</span></div>
          <div><b class="num">${guru}</b><span>guru</span></div>
        </div>
      </div>
    </div>
    ${pageSheet(KELAS_INFO[k].toUpperCase(),rows,"kelas",all)}
    <div class="daylist panel"><div class="eyebrow">Paparan senarai</div>${buildDayList(rows,"kelas")}</div>`;
  fitPages();
}
function guruAnalysis(t,all,subs,kls){
  const W=f=>all.filter(f).reduce((a,l)=>a+l.len,0);
  const total=W(()=>true);
  const bySub=subs.map(s=>({s,w:W(l=>l.sub===s)})).sort((a,b)=>b.w-a.w);
  const byKls=kls.map(k=>({k,w:W(l=>l.kelas===k)})).sort((a,b)=>b.w-a.w);
  const mx=Math.max(...bySub.map(x=>x.w),...byKls.map(x=>x.w));
  const bar=(label,dotH,w,title)=>`<div class="bar-row" title="${esc(title)}" style="cursor:default">
      <span class="bar-name"><span class="dot" style="--h:${dotH}"></span>${label}</span>
      <span class="bar-track"><span class="bar-fill" style="--h:${dotH};width:${w/mx*100}%"></span></span>
      <span class="bar-val num"><b>${w}</b> · ${fmtJam(w)}</span></div>`;
  const tbl=`<table class="mx"><thead><tr><th class="rowh">Subjek</th>${kls.map(k=>`<th><span class="dot" style="--h:${KELAS_HUE[k]}"></span>${kLabel(k)}</th>`).join("")}<th>Waktu/minggu</th><th>Jam/minggu</th><th>Jam setahun</th><th>%</th></tr></thead><tbody>
    ${bySub.map(({s,w})=>`<tr><th class="rowh" title="${esc(SUBJ[s].n)}"><span class="dot" style="--h:${SUBJ[s].h};display:inline-block;margin-right:6px"></span>${s} <span style="font-weight:500;color:var(--fg-2)">${esc(SUBJ[s].n)}</span></th>
      ${kls.map(k=>{const v=W(l=>l.sub===s&&l.kelas===k);return v?`<td class="v num" style="--h:${KELAS_HUE[k]}">${v}</td>`:`<td class="z">–</td>`}).join("")}
      <td class="tot num">${w}</td><td class="tot num">${fmtJam(w)}</td><td class="tot num">${jamSetahun(w)}</td><td class="tot num">${Math.round(w/total*100)}%</td></tr>`).join("")}
    <tr><th class="rowh">Jumlah</th>${byKls.length?kls.map(k=>`<td class="tot num">${W(l=>l.kelas===k)}</td>`).join(""):""}<td class="tot num">${total}</td><td class="tot num">${fmtJam(total)}</td><td class="tot num">${jamSetahun(total)}</td><td class="tot num">100%</td></tr>
    </tbody></table>`;
  return `<div class="panel">
    <div class="eyebrow">Analisis waktu mengajar</div>
    <h2>Bilangan waktu mengikut subjek dan kelas</h2>
    <p class="sub">Seminggu, 1 waktu = 30 minit. Jam setahun dikira bagi ${MINGGU} minggu. Termasuk Perhimpunan (Isnin) dan Kokurikulum (Rabu). Bacaan Yasin tidak dikira.</p>
    <div class="two" style="margin-top:6px">
      <div><div class="eyebrow" style="margin-top:10px">Mengikut subjek</div><div class="bars">${bySub.map(x=>bar(x.s,SUBJ[x.s].h,x.w,SUBJ[x.s].n+": "+x.w+" waktu")).join("")}</div></div>
      <div><div class="eyebrow" style="margin-top:10px">Mengikut kelas</div><div class="bars">${byKls.map(x=>bar(kLabel(x.k),KELAS_HUE[x.k],x.w,(x.k==="_ALL"?"Perhimpunan dan Kokurikulum":KELAS_INFO[x.k])+": "+x.w+" waktu")).join("")}</div></div>
    </div>
    <div class="scroll">${tbl}</div>
  </div>`;
}
function renderGuru(){
  const t=state.guru;
  const rows={};DAYS.forEach(([d])=>rows[d]=teacherDay(t,d));
  const all=LES.filter(l=>l.t===t);
  const w=all.reduce((a,l)=>a+l.len,0);
  const klsAll=[...new Set(all.map(l=>l.kelas))].sort((a,b)=>a==="_ALL"?1:b==="_ALL"?-1:CLASSES.indexOf(a)-CLASSES.indexOf(b));
  const kls=klsAll.filter(k=>k!=="_ALL");
  const subsAll=[...new Set(all.map(l=>l.sub))];
  const subs=subsAll.filter(x=>!SUBJ[x].neutral);
  document.getElementById("v-guru").innerHTML=`
    <div class="toolbar">
      <div class="picker" role="group" aria-label="Pilih guru">${TEACHERS.map(g=>`<button class="pill" data-guru="${g}" aria-pressed="${g===t}" style="--h:${TEACH[g].h}"><span class="dot" style="--h:${TEACH[g].h}"></span>${esc(shortName(g))}</button>`).join("")}</div>
      <div class="legend"><span style="color:var(--muted)">Warna ikut kelas:</span>${kls.map(k=>`<span><span class="dot" style="--h:${KELAS_HUE[k]}"></span><b>${k}</b></span>`).join("")}</div>
    </div>
    <div class="panel">
      <div class="head-card">
        <div><div class="eyebrow">Jadual waktu guru</div><h2>${esc(fullName(t))}</h2>
          <p class="sub">Mengajar ${subs.map(s=>`<b>${s}</b>`).join(", ")} di ${kls.join(", ")}</p></div>
        <div class="stats">
          <div><b class="num">${w}</b><span>waktu seminggu</span></div>
          <div><b>${fmtJam(w)}</b><span>masa mengajar</span></div>
          <div><b class="num">${kls.length}</b><span>kelas</span></div>
        </div>
      </div>
    </div>
    ${guruAnalysis(t,all,subsAll,klsAll)}
    ${pageSheet(fullName(t).toUpperCase(),rows,"guru",all)}
    <div class="daylist panel"><div class="eyebrow">Paparan senarai</div>${buildDayList(rows,"guru")}</div>`;
  fitPages();
}

/* ---------- DETAIL ---------- */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
let lastFocus=null;
function openDetail(idx){
  const l=LES[idx];lastFocus=document.activeElement;
  const dn=DAYS.find(d=>d[0]===l.day)[1];
  const h=state.view==="guru"?KELAS_HUE[l.kelas]:(state.colorBy==="guru"&&l.t?TEACH[l.t].h:SUBJ[l.sub].h);
  const sameDay=l.t?LES.filter(x=>x.t===l.t&&x.day===l.day).sort((a,b)=>a.s-b.s):[];
  sheet.innerHTML=`
    <div class="sheet-top" style="--h:${SUBJ[l.sub].neutral?250:h}">
      <button class="sheet-close" id="sh-close" aria-label="Tutup">×</button>
      <div class="code">${l.sub} · ${l.virtual?"SEMUA":l.kelas}</div>
      <h3 id="sh-title">${esc(SUBJ[l.sub].n)}</h3>
    </div>
    <dl>
      <dt>Guru</dt><dd>${l.t?esc(fullName(l.t)):"Semua guru"}</dd>
      <dt>Kelas</dt><dd>${esc(KELAS_INFO[l.kelas])}</dd>
      <dt>Hari</dt><dd>${dn}</dd>
      <dt>Masa</dt><dd class="num">${range(l.s,l.len)} (waktu ${l.s}${l.len>1?"–"+(l.s+l.len-1):""})</dd>
      <dt>Tempoh</dt><dd class="num">${l.len} waktu · ${l.len*30} minit</dd>
      ${dutyClash(l).length?`<dt>Serentak</dt><dd style="font-weight:500">${dutyClash(l).map(d=>SUBJ[d.sub].n+" ("+range(d.s,d.len)+")").join(", ")} juga dikira untuk guru ini.</dd>`:""}
      ${isYasin(l)?`<dt>Nota</dt><dd style="font-weight:500"><span class="ys">Bacaan Yasin</span><br>${YASIN_NOTE}</dd>`:""}
      ${l.t?`<dt>${dn} guru</dt><dd style="font-weight:500;color:var(--fg-2)">${sameDay.map(x=>`${slotStart(x.s-1)} ${x.kelas} ${x.sub}`).join(" · ")}</dd>`:""}
    </dl>
    <div class="acts">
      ${l.t?`<button class="btn" data-goto-guru="${l.t}"><span>Lihat jadual guru: ${esc(shortName(l.t))}</span><span class="dot" style="--h:${TEACH[l.t].h}"></span></button>`:""}
      ${l.virtual?"":`<button class="btn" data-goto-kelas="${l.kelas}"><span>Lihat jadual kelas ${l.kelas}</span><span>→</span></button>`}
    </div>`;
  sheet.hidden=false;scrim.hidden=false;
  document.getElementById("sh-close").focus();
}
function closeDetail(){sheet.hidden=true;scrim.hidden=true;if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
scrim.addEventListener("click",closeDetail);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeDetail()});

/* ---------- NAV ---------- */
function show(view){
  state.view=view;save();
  document.querySelectorAll(".top .tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  ["rumusan","kelas","guru"].forEach(v=>document.getElementById("v-"+v).hidden=v!==view);
  if(view==="rumusan")renderRumusan();if(view==="kelas")renderKelas();if(view==="guru")renderGuru();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="sh-close"){closeDetail();return}
  if(b.dataset.view){show(b.dataset.view);return}
  if(b.dataset.les){openDetail(+b.dataset.les);return}
  if(b.dataset.kelas){state.kelas=b.dataset.kelas;show("kelas");return}
  if(b.dataset.guru){state.guru=b.dataset.guru;show("guru");return}
  if(b.dataset.color){state.colorBy=b.dataset.color;show(state.view);return}
  if(b.dataset.gotoGuru){closeDetail();state.guru=b.dataset.gotoGuru;show("guru");window.scrollTo({top:0});return}
  if(b.dataset.gotoKelas){closeDetail();state.kelas=b.dataset.gotoKelas;show("kelas");window.scrollTo({top:0});return}
});
const hash=location.hash.slice(1);
if(hash==="rumusan"||hash==="kelas"||hash==="guru")state.view=hash;
if(!["rumusan","kelas","guru"].includes(state.view))state.view="rumusan";
if(!KELAS[state.kelas])state.kelas="UTM";if(!TEACH[state.guru])state.guru="MUIZ";
show(state.view);
</script>
</body></html>
